name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_STATIC: "1"
      NEXT_PUBLIC_BASE_PATH: /Trisle_Website
      NEXT_PUBLIC_POLAR_CHECKOUT_LINK: https://buy.polar.sh/polar_cl_jkMs1ZdTOWI93aVTCiwdz1zKZKPLWr78XVJwC2IsUjI
      # Public build-time config, passed from repo Variables (Settings > Secrets and variables > Actions > Variables).
      # Unset variables expand to empty strings and the features simply stay omitted.
      # GA Measurement ID: repo Variable wins if set; fallback below activates the
      # live property G-0Z165PW33N (a Measurement ID is public client-side info).
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID || 'G-0Z165PW33N' }}
      NEXT_PUBLIC_GA_CONSENT: ${{ vars.NEXT_PUBLIC_GA_CONSENT }}
      NEXT_PUBLIC_GSC_SITE_VERIFICATION: ${{ vars.NEXT_PUBLIC_GSC_SITE_VERIFICATION }}
      NEXT_PUBLIC_BING_SITE_VERIFICATION: ${{ vars.NEXT_PUBLIC_BING_SITE_VERIFICATION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static site
        run: bunx next build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
